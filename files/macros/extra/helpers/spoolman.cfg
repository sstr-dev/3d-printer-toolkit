# Spoolman spool tracking through Moonraker's spoolman_set_active_spool method.
# Requires a configured Moonraker Spoolman integration.
# SET_ACTIVE_SPOOL requires ID, the integer spool ID; CLEAR_ACTIVE_SPOOL clears it.
# These commands update tracking only; they do not load or unload filament.
# Include either this file or filaman.cfg: both define the same macro names.

#=====================================================
# SPOOLMAN
#=====================================================
[gcode_macro SET_ACTIVE_SPOOL]
description: Set the currently tracked spool ID
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
description: Clear spool tracking (useful when unloading filament for example)
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}