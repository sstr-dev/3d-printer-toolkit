# FilaMan spool tracking through its Moonraker component.
# Requires the component providing the filaman_set_active_spool remote method.
# SET_ACTIVE_SPOOL requires ID, the integer spool ID; CLEAR_ACTIVE_SPOOL clears it.
# These commands update tracking only; they do not load or unload filament.
# Include either this file or spoolman.cfg: both define the same macro names.

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method("filaman_set_active_spool", spool_id=id)}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method("filaman_set_active_spool", spool_id=None)}