# COUNT defaults to 1; DISABLE_MOTORS=1 disables steppers after all moves.
# Requires an XY travel area from 0 to 220 mm and Z=10 mm.
[gcode_macro BED_TRAVEL]
description: Move around the bed, then to its center
gcode:
    {% set count = params.COUNT|default(1)|int %}
    {% set disable_motors = params.DISABLE_MOTORS|default(0)|int %}
    {% if count < 1 %}
        {action_raise_error("COUNT must be at least 1")}
    {% endif %}
    {% if disable_motors not in [0, 1] %}
        {action_raise_error("DISABLE_MOTORS must be 0 or 1")}
    {% endif %}
    SAVE_GCODE_STATE NAME=bed_travel_state
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G1 Z10 F3000
    {% for iteration in range(count) %}
        G1 X0 Y0 F6000
        G1 X220 Y0 F6000
        G1 X220 Y220 F6000
        G1 X0 Y220 F6000
        G1 X110 Y110 F6000
    {% endfor %}
    M400
    RESTORE_GCODE_STATE NAME=bed_travel_state
    {% if disable_motors %}
        M84
    {% endif %}
