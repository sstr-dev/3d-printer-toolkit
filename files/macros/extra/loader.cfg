# Extra macros loader. Full instructions: docs/extra-macros.md in the toolkit.
# Setup installs this as 3dp-toolkit/macros_loader.cfg and enables it in printer.cfg.
# Manual installation: copy this template beside printer.cfg as macros_loader.cfg,
# copy the macro subdirectories into macros/, then add [include macros_loader.cfg]
# to printer.cfg. Restart Klipper after changing includes.
# Paths below are relative to this loader; macros/ must be beside it.
# Keep this local copy for your selections and your own macro includes.
# A leading # disables an include. Remove it only for features you need.
# Avoid including the same macros elsewhere in printer.cfg.

# Calibration: loads CALIBRATE, flow and pressure advance macros, but not TEST_SPEED.
# Direct flow/PA commands require a homed, heated and print-ready printer.
# CALIBRATE additionally requires compatible _USER_VARIABLES, START_PRINT and END_PRINT.
# Console examples (temperatures must suit your filament):
# CALIBRATE TYPE=flow BED_TEMP=60 EXTRUDER_TEMP=210 MATERIAL=PLA
# CALIBRATE TYPE=pressure_advance BED_TEMP=60 EXTRUDER_TEMP=210 MATERIAL=PLA
# After measuring the flow shell: COMPUTE_FLOW_MULTIPLIER MEASURED_THICKNESS=0.78
[include macros/calibration/calib*.cfg]

# Motion test: requires _TILT_CALIBRATE; moves across the bed and re-homes.
# Compare GET_POSITION reports for skipped steps; choose suitable machine limits.
# Console example: TEST_SPEED SPEED=200 ACCEL=3000 ITERATIONS=5
#[include macros/calibration/test_speed.cfg]

# Debugging: search printer status without changing settings.
# Console example: _SEARCH_VARS S=extruder
#[include macros/miscs/debugging.cfg]

# Compatibility aliases: check for existing M600/M204 and other macro conflicts first.
# Requires LOAD_FILAMENT, UNLOAD_FILAMENT, CHANGE_FILAMENT, PARK and arc support.
# M204 handles S only; this version's G03 alias calls clockwise G2 (see guide).
# Console example: M900 K=0.035
#[include macros/miscs/compatibility.cfg]

# Spool tracking: enable ONE provider only; both define the same macro names.
# Requires the matching Moonraker integration (Spoolman or FilaMan).
# Console examples: SET_ACTIVE_SPOOL ID=123 then CLEAR_ACTIVE_SPOOL when unloading.
# These macros update tracking only; they do not move or load filament.
#[include macros/helpers/spoolman.cfg]
#[include macros/helpers/filaman.cfg]

# Your own macros: create macros/custom.cfg before enabling this include.
# Keep your custom macro names unique, then restart Klipper after editing.
#[include macros/custom.cfg]
